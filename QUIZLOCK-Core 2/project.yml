name: QUIZLOCK
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.32.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  QUIZLOCK:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuizLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.QUIZLOCK
        PRODUCT_NAME: QUIZLOCK
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/QUIZLOCK.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: QUIZLOCK
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: QUIZLOCKMonitor
        embed: true
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers

  QUIZLOCKMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuizLockMonitor
      - path: QuizLock/Shared/QuizLockShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.QUIZLOCK.monitor
        PRODUCT_NAME: QUIZLOCKMonitor
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/QUIZLOCKMonitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/QUIZLOCKMonitor.entitlements
