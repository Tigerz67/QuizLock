name: Build unsigned QUIZLOCK IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          SPEC_FILE="$(find . -name project.yml \
            -not -path '*/.git/*' -print -quit)"

          if [[ -z "$SPEC_FILE" ]]; then
            echo "project.yml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QUIZLOCK-unsigned-IPA
          path: ${{ env.PROJECT_DIR }}/dist/QUIZLOCK-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
