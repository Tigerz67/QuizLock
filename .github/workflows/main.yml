name: Build unsigned QUIZLOCK IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate project and generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          SPEC_FILE="$(find . -name project.yml \
            -not -path '*/.git/*' -print -quit)"

          if [[ -z "$SPEC_FILE" ]]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml

      - name: Build unsigned QUIZLOCK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p diagnostics
          rm -rf build dist

          set +e
          xcodebuild \
            -skipMacroValidation \
            -project QUIZLOCK.xcodeproj \
            -scheme QUIZLOCK \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee diagnostics/xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo "Xcode build failed."
            exit "$BUILD_STATUS"
          fi

      - name: Validate and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/QUIZLOCK.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/QUIZLOCKMonitor.appex"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "ERROR: QUIZLOCK.app not found"
            exit 1
          fi

          if [[ ! -d "$EXTENSION_PATH" ]]; then
            echo "ERROR: QUIZLOCKMonitor.appex not found"
            exit 1
          fi

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/

          cd dist
          zip -qry QUIZLOCK-unsigned.ipa Payload

          test -s QUIZLOCK-unsigned.ipa
          unzip -l QUIZLOCK-unsigned.ipa

          echo "Unsigned IPA created:"
          ls -lh QUIZLOCK-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QUIZLOCK-unsigned-IPA
          path: ${{ env.PROJECT_DIR }}/dist/QUIZLOCK-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QUIZLOCK-build-diagnostics
          path: ${{ env.PROJECT_DIR }}/diagnostics/
          if-no-files-found: warn
          retention-days: 7
