name: Build unsigned QUIZLOCK IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate project.yml and build unsigned IPA
        run: |
          SPEC_FILE=$(find . -name "project.yml" -print -quit)
          if [ -z "$SPEC_FILE" ]; then
            echo "Error: Could not find project.yml anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SPEC_FILE")
          echo "Found project.yml in $PROJECT_DIR"
          cd "$PROJECT_DIR"

          xcodegen generate

          xcodebuild \
            -project QUIZLOCK.xcodeproj \
            -scheme QUIZLOCK \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/QUIZLOCK.app dist/Payload/
          cd dist
          zip -r QUIZLOCK-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUIZLOCK-unsigned-IPA
          path: "**/dist/QUIZLOCK-unsigned.ipa"
