
name: Build unsigned QUIZLOCK IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project and build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          SPEC_FILE=$(find . -name "project.yml" -not -path "*/.git/*" -print -quit)

          if [ -z "$SPEC_FILE" ]; then
            echo "Error: project.yml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC_FILE")
          cd "$PROJECT_DIR"

          echo "Generating Xcode project..."
          xcodegen generate

          echo "Building unsigned iOS app..."

          xcodebuild \
            -project QUIZLOCK.xcodeproj \
            -scheme QUIZLOCK \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build

          APP_PATH="build/Build/Products/Release-iphoneos/QUIZLOCK.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: QUIZLOCK.app was not generated!"
            exit 1
          fi

          echo "Packaging IPA..."

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/

          cd dist
          zip -r QUIZLOCK-unsigned.ipa Payload

          echo "Unsigned IPA created successfully!"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUIZLOCK-unsigned-IPA
          path: "**/dist/QUIZLOCK-unsigned.ipa"
          if-no-files-found: error
          retention-days: 7
